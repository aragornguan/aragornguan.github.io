<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Travel Itinerary — Italy · Greece · Japan</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cream:#f4efe3;--cream2:#faf7f0;--navy:#1a2d5a;--gold:#c8a020;
  --terra:#c45c3a;--panel:#faf8f5;--ocean:#0a3d82;--cherry:#ff9eb5;
  --label-bg:rgba(4,12,36,0.90);
}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Lato",sans-serif;}
#app{display:flex;flex-direction:column;height:100vh;background:var(--cream);}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:54px;background:var(--navy);border-bottom:2px solid var(--gold);z-index:1001;flex-shrink:0;}
.logo{font-family:"Playfair Display",serif;font-size:19px;color:#f0ebe0;letter-spacing:3px;}
.logo span{color:var(--gold);}
.nav-pills{display:flex;gap:6px;}
.nav-pill{padding:6px 18px;border-radius:20px;border:1.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.55);cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .22s;background:transparent;user-select:none;}
.nav-pill:hover{color:white;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);}
.nav-pill.active{background:rgba(200,160,32,.2);border-color:var(--gold);color:var(--gold);}

/* MAIN TWO-COLUMN */
#main{flex:1;display:flex;overflow:hidden;}

/* LEFT ITINERARY PANEL */
#left-panel{width:390px;flex-shrink:0;display:flex;flex-direction:column;background:var(--cream);border-right:1px solid rgba(26,45,90,.14);overflow:hidden;transition:width .32s cubic-bezier(.4,0,.2,1);}
#left-panel.collapsed{width:0;border-right:none;}

/* Country hero */
#country-hero{background:var(--navy);color:white;padding:18px 20px 14px;flex-shrink:0;}
.hero-title{font-family:"Playfair Display",serif;font-size:24px;font-weight:900;color:white;line-height:1.15;margin-bottom:6px;}
.hero-title .days-num{color:var(--gold);}
.hero-tagline{font-size:10.5px;color:rgba(255,255,255,.68);letter-spacing:.4px;margin-bottom:11px;line-height:1.55;}
.hero-badges{display:flex;flex-wrap:wrap;gap:5px;}
.hero-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 9px;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.3px;}

/* Day list */
#day-list{flex:1;overflow-y:auto;padding:6px 0;}
#day-list::-webkit-scrollbar{width:4px;}
#day-list::-webkit-scrollbar-thumb{background:rgba(26,45,90,.18);border-radius:2px;}

.day-item{display:flex;align-items:flex-start;gap:10px;padding:9px 16px 9px 14px;border-bottom:1px solid rgba(26,45,90,.06);cursor:pointer;transition:background .15s;}
.day-item:hover{background:rgba(26,45,90,.04);}
.day-item.active{background:rgba(200,160,32,.12);border-left:3px solid var(--gold);padding-left:11px;}
.day-badge{width:33px;height:33px;border-radius:7px;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1.1;}
.day-badge .dn{font-size:10.5px;font-weight:900;color:var(--gold);letter-spacing:.2px;}
.day-icon{font-size:17px;flex-shrink:0;margin-top:7px;width:20px;text-align:center;}
.day-content{flex:1;min-width:0;}
.day-title{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:2px;line-height:1.3;}
.day-sub{list-style:none;padding:0;}
.day-sub li{font-size:10.5px;color:#666;line-height:1.5;padding-left:9px;position:relative;}
.day-sub li::before{content:"·";position:absolute;left:1px;color:var(--gold);}

/* Highlights */
#highlights{display:grid;grid-template-columns:1fr 1fr;flex-shrink:0;border-top:2px solid var(--navy);}
.hl-card{padding:11px 13px;background:var(--cream2);border-right:1px solid rgba(26,45,90,.1);border-bottom:1px solid rgba(26,45,90,.08);}
.hl-card:nth-child(2n){border-right:none;}
.hl-icon{font-size:20px;margin-bottom:4px;}
.hl-title{font-size:10px;font-weight:900;color:var(--navy);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;}
.hl-desc{font-size:9.5px;color:#777;line-height:1.4;}

/* MAP */
#map-wrap{flex:1;position:relative;overflow:hidden;}
#map{width:100%;height:100%;}

/* DAY MARKERS on map */
.dm-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;transform-origin:50% 100%;transition:transform .18s;filter:drop-shadow(0 3px 10px rgba(0,0,0,.5));}
.dm-wrap:hover{transform:scale(1.1);}
.dm-day-badge{background:var(--navy);color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.3px;padding:2px 7px;border-radius:10px;margin-bottom:3px;white-space:nowrap;border:1px solid rgba(200,160,32,.5);}
.dm-photo{width:56px;height:56px;border-radius:50%;border:3px solid white;box-shadow:0 3px 12px rgba(0,0,0,.55);background-size:cover;background-position:center;transition:background-image .4s;}
.dm-photo.italy  {background-color:#503020;}
.dm-photo.greece {background-color:#102050;}
.dm-photo.japan  {background-color:#400010;}
.dm-line{width:1.5px;height:7px;background:rgba(255,255,255,.35);margin:0 auto;}
.dm-dot{width:9px;height:9px;border-radius:50%;border:2.5px solid white;margin:2px auto 0;box-shadow:0 0 8px rgba(255,255,255,.5);}
.dm-dot.italy  {background:#e06040;}
.dm-dot.greece {background:#4080e0;}
.dm-dot.japan  {background:#e00030;}
.dm-photo.japan.hokkaido{background-color:#103060;}
.dm-dot.hokkaido{background:#1860d8;}
.dm-name{font-size:9.5px;font-weight:700;color:white;text-shadow:0 1px 4px rgba(0,0,0,.9);margin-top:2px;white-space:nowrap;text-align:center;}

/* COMPASS */
#compass{position:absolute;bottom:32px;right:18px;z-index:50;width:76px;height:76px;pointer-events:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6));}

/* MAP LEGEND */
#map-legend{position:absolute;top:12px;right:12px;z-index:50;background:rgba(4,14,42,.82);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:9px 13px;backdrop-filter:blur(8px);pointer-events:none;}
.leg-item{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:9.5px;color:rgba(255,255,255,.8);}
.leg-item:last-child{margin-bottom:0;}
.leg-line{width:26px;height:2px;border-radius:1px;}
.leg-line.route-gold{background:#f0b030;}
.leg-line.route-dash{background:repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0,rgba(255,255,255,.7) 4px,transparent 4px,transparent 8px);}

/* LEFT TOGGLE BUTTON */
#left-toggle{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:22px;height:56px;background:rgba(4,14,42,.88);border:1px solid rgba(200,160,32,.4);border-radius:6px;color:var(--gold);font-size:17px;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;transition:background .2s;padding:0;line-height:1;}
#left-toggle:hover{background:rgba(26,45,90,.95);}

/* CHERRY BLOSSOMS */
.petal{position:absolute;pointer-events:none;z-index:20;opacity:0;animation:fallPetal linear infinite;user-select:none;}
@keyframes fallPetal{0%{opacity:0;transform:translateY(0) rotate(0deg);}8%{opacity:.88;}92%{opacity:.65;}100%{opacity:0;transform:translateY(108vh) rotate(780deg);}}

/* DETAIL PANEL */
#panel{position:absolute;top:0;right:0;width:500px;height:100%;background:var(--panel);box-shadow:-4px 0 30px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .38s cubic-bezier(.25,.46,.45,.94);z-index:1000;display:flex;flex-direction:column;overflow:hidden;}
#panel.open{transform:translateX(0);}
.p-hero{height:220px;position:relative;overflow:hidden;display:flex;align-items:flex-end;flex-shrink:0;}
.p-hero-bg{position:absolute;inset:0;}
.p-hero-info{position:relative;z-index:2;padding:20px 24px;}
.p-tag{display:inline-block;background:var(--gold);color:white;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 14px;border-radius:10px;margin-bottom:8px;}
.p-hero-info h2{font-family:"Playfair Display",serif;font-size:26px;color:white;text-shadow:0 2px 14px rgba(0,0,0,.7);line-height:1.1;}
.p-hero-info .tagline{font-size:14px;color:rgba(255,255,255,.85);margin-top:5px;}
.p-close{position:absolute;top:12px;right:12px;z-index:3;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.3);border:none;color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:background .2s;}
.p-close:hover{background:rgba(0,0,0,.55);}
.p-tabs{display:flex;border-bottom:1px solid #e5e0d8;flex-shrink:0;}
.p-tab{flex:1;padding:13px 4px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#bbb;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;user-select:none;}
.p-tab.active{color:var(--terra);border-bottom-color:var(--terra);}
.p-body{flex:1;overflow-y:auto;padding:20px;}
.p-body::-webkit-scrollbar{width:5px;}
.p-body::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px;}
.sec-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#c0bbb2;margin-bottom:14px;}
.sight-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.sight-item{display:flex;align-items:flex-start;gap:14px;padding:10px 14px 10px 10px;background:white;border-radius:12px;border:1px solid #ede9e3;overflow:hidden;}
.sight-photo{width:100px;height:100px;border-radius:9px;flex-shrink:0;background-size:cover;background-position:center;background-color:#ddd8d0;position:relative;overflow:hidden;animation:shimmer 1.4s infinite linear;background-image:linear-gradient(90deg,#ddd8d0 25%,#eee9e2 50%,#ddd8d0 75%);background-size:300% 100%;}
.sight-photo.loaded{animation:none;}
.sight-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.4) 0%,transparent 50%);pointer-events:none;}
.sight-badge{position:absolute;bottom:4px;left:4px;z-index:1;font-size:14px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
.sight-item strong{font-size:14px;color:#222;display:block;margin-bottom:4px;margin-top:3px;}
.sight-item span{font-size:12px;color:#888;line-height:1.5;}
.best-time{background:linear-gradient(135deg,#e8f4e0,#d4efc8);border-radius:8px;padding:12px 14px;margin-bottom:14px;}
.best-time strong{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#4a7c3a;}
.best-time p{font-size:13px;color:#5a8040;margin-top:3px;}
.w-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.w-card{background:white;border-radius:8px;padding:11px;border:1px solid #ede9e3;}
.w-season{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:1px;}
.w-temp{font-family:"Playfair Display",serif;font-size:20px;color:var(--terra);margin:3px 0;}
.w-desc{font-size:11px;color:#666;line-height:1.4;}
.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.food-card{background:white;border-radius:10px;padding:14px 10px;border:1px solid #ede9e3;text-align:center;}
.food-emoji{font-size:30px;display:block;margin-bottom:7px;}
.food-name{font-size:13px;font-weight:700;color:#333;}
.food-desc{font-size:11px;color:#999;margin-top:3px;line-height:1.4;}
.tr-list{display:flex;flex-direction:column;gap:10px;}
.tr-item{display:flex;gap:14px;align-items:flex-start;padding:12px;background:white;border-radius:10px;border:1px solid #ede9e3;}
.tr-ico{width:42px;height:42px;border-radius:10px;background:#f3efe6;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.tr-item strong{font-size:14px;color:#333;display:block;}
.tr-item span{font-size:12px;color:#888;line-height:1.5;}
.maplibregl-canvas{outline:none;}
.maplibregl-ctrl-group{border-radius:8px !important;overflow:hidden;background:rgba(4,12,36,.85) !important;border:1px solid rgba(255,255,255,.15) !important;}
.maplibregl-ctrl button{color:white !important;}
.maplibregl-ctrl-icon{filter:invert(1) !important;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">&#9992; WORLD <span>TRAVEL</span></div>
    <div class="nav-pills">
      <div class="nav-pill active" onclick="switchCountry('italy')">&#127470;&#127481; Italy</div>
      <div class="nav-pill" onclick="switchCountry('greece')">&#127468;&#127479; Greece</div>
      <div class="nav-pill" onclick="switchCountry('japan')">&#127471;&#127477; Japan</div>
    </div>
    <div style="width:140px;text-align:right;font-size:10px;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;">Illustrated Guide</div>
  </header>

  <div id="main">
    <div id="left-panel">
      <div id="country-hero">
        <div class="hero-title" id="hero-title"></div>
        <div class="hero-tagline" id="hero-tagline"></div>
        <div class="hero-badges" id="hero-badges"></div>
      </div>
      <div id="day-list"></div>
      <div id="highlights"></div>
    </div>

    <div id="map-wrap">
      <button id="left-toggle" onclick="toggleLeft()" title="Toggle itinerary">&#8249;</button>
      <div id="map"></div>

      <div id="map-legend">
        <div class="leg-item"><div class="leg-line route-gold"></div><span>Travel route</span></div>
        <div class="leg-item"><div class="leg-line route-dash"></div><span>Return route</span></div>
      </div>

      <svg id="compass" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="rgba(4,14,42,0.82)" stroke="rgba(200,160,32,0.5)" stroke-width="1.5"/>
        <polygon points="50,8 54,42 50,38 46,42" fill="#c8a020"/>
        <polygon points="50,92 54,58 50,62 46,58" fill="rgba(255,255,255,0.45)"/>
        <polygon points="8,50 42,46 38,50 42,54" fill="rgba(255,255,255,0.45)"/>
        <polygon points="92,50 58,46 62,50 58,54" fill="rgba(255,255,255,0.45)"/>
        <text x="50" y="6"  text-anchor="middle" font-size="10" font-weight="700" fill="#c8a020" font-family="Lato,sans-serif">N</text>
        <text x="50" y="98" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)" font-family="Lato,sans-serif">S</text>
        <text x="3"  y="54" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)" font-family="Lato,sans-serif">W</text>
        <text x="97" y="54" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)" font-family="Lato,sans-serif">E</text>
        <circle cx="50" cy="50" r="4" fill="#c8a020" stroke="white" stroke-width="1.5"/>
      </svg>

      <div id="panel">
        <div class="p-hero" id="p-hero">
          <div class="p-hero-bg" id="p-bg"></div>
          <div class="p-hero-info">
            <div class="p-tag" id="p-country"></div>
            <h2 id="p-name"></h2>
            <div class="tagline" id="p-tagline"></div>
          </div>
          <button class="p-close" onclick="closePanel()">&#10005;</button>
        </div>
        <div class="p-tabs">
          <div class="p-tab active" onclick="switchTab('sights',this)">&#127963; Sights</div>
          <div class="p-tab" onclick="switchTab('weather',this)">&#9728;&#65039; Weather</div>
          <div class="p-tab" onclick="switchTab('food',this)">&#127869; Food</div>
          <div class="p-tab" onclick="switchTab('transport',this)">&#128652; Getting There</div>
        </div>
        <div class="p-body" id="p-body"></div>
      </div>
    </div>
  </div>
</div>


<script>
const ITINERARIES = {

    days: [

      {n:'D3', icon:'🚂', title:'Milan → Venice', sub:['High-speed train 2.5h','Evening gondola on the Grand Canal'], locs:['venice']},
      {n:'D4', icon:'⛵', title:'Venice', sub:["St. Mark's Basilica & Doge's Palace",'Rialto Bridge & market stalls','Vaporetto Line 1 scenic tour'], locs:['venice']},
      {n:'D5', icon:'🚂', title:'Venice → Florence', sub:['Trenitalia 2h','Arrive Florence, Ponte Vecchio stroll'], locs:['florence']},
      {n:'D6', icon:'🎨', title:'Florence', sub:['Uffizi Gallery (pre-book essential)',"Brunelleschi's Dome — climb to the top","Michelangelo's David at the Accademia"], locs:['florence']},

      {n:'D15', icon:'✈', title:'Sicily → Home', sub:['Catania airport transfer','Return flight home'], locs:['sicily']},
    ]
  },

  greece: {
    title: 'Greece', duration: '15 Days',
    tagline: 'Aegean Islands × Ancient Myths × World Heritage Panorama',
    badges: ['🏗 Ancient Civilisation', '⛴ 3-Island Journey', '🌅 Caldera Sunsets'],
    highlights: [
      {icon:'🏗', title:'UNESCO Heritage', desc:'Acropolis · Delphi · Olympia · Meteora'},
      {icon:'⛴', title:'Aegean Islands', desc:'Mykonos · Santorini · Crete'},
      {icon:'🏨', title:'Premium Stays', desc:'4-5★ Hotels · Santorini Cave Suite'},

    days: [
      {n:'D1', icon:'✈', title:'Depart → Athens', sub:['Arrive Athens (ATH)','Hotel check-in in Plaka district'], locs:['athens']},
      {n:'D2', icon:'🏗', title:'Athens', sub:['Acropolis & Parthenon (sunrise visit)','National Archaeological Museum','Monastiraki flea market & souvlaki'], locs:['athens']},
      {n:'D3', icon:'🚌', title:'Athens → Peloponnese', sub:['Ancient Corinth ruins','Mycenae Lion Gate citadel','Drive to Olympia'], locs:['athens']},
      {n:'D4', icon:'🏅', title:'Olympia → Delphi', sub:['Original Olympic stadium & museum','Temple of Zeus ruins (470 BC)','Drive to Delphi village'], locs:['meteora']},
      {n:'D5', icon:'🏗', title:'Delphi', sub:['Apollo sanctuary & oracle site','Delphi Archaeological Museum','Arachova mountain village stop'], locs:['meteora']},
      {n:'D6', icon:'⛪', title:'Meteora', sub:['Great Meteoron Monastery (1340 AD)','Sunrise mist over the rock pillars','Drive back to Athens'], locs:['meteora']},

const map = new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:[12.5,42.5], zoom:5.2, pitch:48, bearing:-12,
  antialias:true, minZoom:2, maxZoom:14
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-left');

let mapLoaded=false, pendingCountry='italy', currentCountry=null, _markers=[];

map.on('load',()=>{
  map.getStyle().layers.forEach(layer=>{
    if(layer.type==='fill'&&(layer.id.includes('water')||layer.id.includes('ocean')||layer.id.includes('sea')))
      try{map.setPaintProperty(layer.id,'fill-color','#0a3d82');}catch(e){}
    if(layer.type==='line'&&layer.id.includes('water'))
      try{map.setPaintProperty(layer.id,'line-color','#0a4a9e');}catch(e){}
    if(layer.layout&&layer.layout['text-field'])
      try{map.setLayoutProperty(layer.id,'text-field',['coalesce',['get','name:en'],['get','name']]);}catch(e){}
  });
  map.addSource('terrain-dem',{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',maxzoom:15});
  map.setTerrain({source:'terrain-dem',exaggeration:1.8});
  map.addLayer({id:'sky',type:'sky',paint:{'sky-type':'atmosphere','sky-atmosphere-sun':[0.0,30.0],'sky-atmosphere-sun-intensity':15}});
  map.addSource('route',{type:'geojson',data:{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[]}}});
  map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},
    paint:{'line-color':'#f0b030','line-width':2.8,'line-dasharray':[5,3],'line-opacity':0.9}});
  mapLoaded=true;
  switchCountry(pendingCountry);
});

function switchCountry(country){
  if(!mapLoaded){pendingCountry=country;return;}
  currentCountry=country;
  document.querySelectorAll('.nav-pill').forEach((p,i)=>{
    p.classList.toggle('active',['italy','greece','japan'][i]===country);
  });
  renderItinerary(country);
  updateRoute(country);
  updateDayMarkers(country);
  map.flyTo({...FLY_TO[country]});
  if(country==='japan') startPetals(); else stopPetals();
  closePanel();
}

function renderItinerary(country){
  const it=ITINERARIES[country];
  document.getElementById('hero-title').innerHTML=it.title+' <span class="days-num">'+it.duration+'</span>';
  document.getElementById('hero-tagline').textContent=it.tagline;
  document.getElementById('hero-badges').innerHTML=it.badges.map(b=>`<span class="hero-badge">${b}</span>`).join('');
  document.getElementById('day-list').innerHTML=it.days.map((d,i)=>`
    <div class="day-item" id="di-${i}" onclick="activateDay(${i},'${country}')">
      <div class="day-badge"><span class="dn">${d.n}</span></div>
      <div class="day-icon">${d.icon}</div>
      <div class="day-content">
        <div class="day-title">${d.title}</div>
        <ul class="day-sub">${d.sub.map(s=>`<li>${s}</li>`).join('')}</ul>
      </div>
    </div>`).join('');
  document.getElementById('highlights').innerHTML=it.highlights.map(h=>`
    <div class="hl-card">
      <div class="hl-icon">${h.icon}</div>
      <div class="hl-title">${h.title}</div>
      <div class="hl-desc">${h.desc}</div>
    </div>`).join('');
}

function activateDay(i,country){
  document.querySelectorAll('.day-item').forEach((el,j)=>el.classList.toggle('active',j===i));
  const d=ITINERARIES[country].days[i];
  if(d.locs&&d.locs[0]&&DATA[d.locs[0]]) openPanel(d.locs[0]);
}

function updateRoute(country){
  map.getSource('route').setData({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:ROUTE_COORDS[country]}});
}

function updateDayMarkers(country){
  _markers.forEach(m=>m.remove()); _markers=[];
  (DAY_MARKERS[country]||[]).forEach(lm=>{
    const el=document.createElement('div');
    const pid=`dm-${lm.id}`;
    el.innerHTML=`
      <div class="dm-wrap">
        <div class="dm-day-badge">${lm.day}</div>
        <div class="dm-photo ${lm.country}" id="${pid}"></div>
        <div class="dm-line"></div>
        <div class="dm-dot ${lm.country}"></div>
        <div class="dm-name">${lm.name}</div>
      </div>`;
    el.addEventListener('click',(e)=>{e.stopPropagation();openPanel(lm.id);});
    _markers.push(new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([lm.lng,lm.lat]).addTo(map));
    wikiImg(lm.wiki).then(src=>{
      if(!src)return;
      const b=document.getElementById(pid);
      if(b){b.style.backgroundImage=`url('${src}')`;b.style.backgroundSize='cover';b.style.backgroundPosition='center';}
    });
  });
}

let _petalTimer=null;
function startPetals(){
  if(_petalTimer)return;
  const wrap=document.getElementById('map-wrap');
  _petalTimer=setInterval(()=>{
    const p=document.createElement('div');
    p.className='petal';p.textContent='🌸';
    p.style.left=(Math.random()*100)+'vw';p.style.top='-24px';
    p.style.fontSize=(11+Math.random()*9)+'px';
    p.style.animationDuration=(7+Math.random()*9)+'s';
    p.style.animationDelay=(Math.random()*1.5)+'s';
    wrap.appendChild(p);setTimeout(()=>p.remove(),18000);
  },280);
}
function stopPetals(){
  if(_petalTimer){clearInterval(_petalTimer);_petalTimer=null;}
  document.querySelectorAll('.petal').forEach(p=>p.remove());
}

function toggleLeft(){
  const lp=document.getElementById('left-panel');
  const btn=document.getElementById('left-toggle');
  lp.classList.toggle('collapsed');
  btn.innerHTML=lp.classList.contains('collapsed')?'&#8250;':'&#8249;';
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});

  hakone:         {hero:'Hakone',         sights:['Hakone Open-Air Museum','Owakudani','Lake Ashi','Hakone Ropeway']},
  nikko:          {hero:'Nikkō',          sights:['Tōshō-gū','Yōmei-mon','Kegon Falls','Nikkō Cryptomeria Avenue']},
  kamakura:       {hero:'Kamakura',       sights:['Kōtoku-in','Tsurugaoka Hachiman-gū','Hokoku-ji','Yuigahama Beach']},
  kanazawa:       {hero:'Kanazawa',       sights:['Kenroku-en','Higashi Chaya District','Kanazawa Castle','Omicho Market']},
  sapporo:        {hero:'Sapporo',        sights:['Odori Park','Sapporo Beer Museum','Hokkaido Jingu','Susukino']},
  hakodate:       {hero:'Hakodate',       sights:['Hakodate at night','Fort Goryokaku','Hakodate Morning Market','Motomachi, Hakodate']},
  niseko:         {hero:'Niseko',         sights:['Niseko ski resort','Mount Yōtei','Niseko','Grand Hirafu']},
  biei:           {hero:'Biei, Hokkaido', sights:['Farm Tomita','Biei, Hokkaido','Shikisai-no-Oka','Furano ski resort']},
};

async function wikiImg(title) {
  try {
    const r = await fetch(
      `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`,
      {headers:{Accept:'application/json'}}
    );
    if (!r.ok) return null;
    const j = await r.json();
    return j.thumbnail?.source ?? null;
  } catch { return null; }
}

// ═══════════════════════════════════════════════
//  PANEL LOGIC
// ═══════════════════════════════════════════════
let current = null;
let currentTab = 'sights';

function openPanel(id) {
  const d = DATA[id];
  if (!d) return;
  current = id;
  currentTab = 'sights';

  document.getElementById('p-country').textContent = d.country;
  document.getElementById('p-name').textContent = d.name;
  document.getElementById('p-tagline').textContent = d.tagline;
  const bg = document.getElementById('p-bg');
  bg.style.cssText = 'position:absolute;inset:0;background:#1e2a45;';
  const wikiD = WIKI[id];
  wikiImg(wikiD ? wikiD.hero : d.name).then(src => {
    if (!src) return;
    bg.style.cssText =
      `background-image:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.18) 65%),url('${src}');` +
      `background-size:cover;background-position:center;position:absolute;inset:0;`;
  });

  document.querySelectorAll('.p-tab').forEach((t,i) => t.classList.toggle('active', i===0));
  renderTab('sights');
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  current = null;
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.p-tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  renderTab(tab);
}

function renderTab(tab) {
  const d = DATA[current];
  if (!d) return;
  const body = document.getElementById('p-body');
  if (tab === 'sights') {
    const wikiD = WIKI[current];
    body.innerHTML = `<p class="sec-title">Top Attractions</p>
      <ul class="sight-list">${d.sights.map((s,i) => `
        <li class="sight-item">
          <div class="sight-photo" id="simg-${i}">
            <span class="sight-badge">${s.icon}</span>
          </div>
          <div><strong>${s.name}</strong><span>${s.desc}</span></div>
        </li>`).join('')}</ul>`;
    const snapId = current;
    d.sights.forEach((s, i) => {
      const title = wikiD ? wikiD.sights[i] : s.name;
      wikiImg(title).then(src => {
        if (!src || current !== snapId) return;
        const el = document.getElementById(`simg-${i}`);
        if (!el) return;
        el.style.backgroundImage = `url('${src}')`;
        el.style.backgroundSize = 'cover';
        el.style.backgroundPosition = 'center';
        el.classList.add('loaded');
      });
    });
  } else if (tab === 'weather') {
    body.innerHTML = `
      <div class="best-time"><strong>✦ Best Time to Visit</strong><p>${d.bestTime}</p></div>
      <p class="sec-title">Season by Season</p>
      <div class="w-grid">${[['🌸 Spring','spring'],['☀️ Summer','summer'],['🍂 Autumn','autumn'],['❄️ Winter','winter']].map(([l,k])=>`
        <div class="w-card"><div class="w-season">${l}</div>
        <div class="w-temp">${d.weather[k].temp}</div>
        <div class="w-desc">${d.weather[k].desc}</div></div>`).join('')}</div>`;
  } else if (tab === 'food') {
    body.innerHTML = `<p class="sec-title">Must-Try Dishes & Drinks</p>
      <div class="food-grid">${d.foods.map(f=>`
        <div class="food-card"><span class="food-emoji">${f.emoji}</span>
        <div class="food-name">${f.name}</div>
        <div class="food-desc">${f.desc}</div></div>`).join('')}</div>`;
  } else if (tab === 'transport') {
    body.innerHTML = `<p class="sec-title">Getting There & Around</p>
      <div class="tr-list">${d.transport.map(t=>`
        <div class="tr-item"><div class="tr-ico">${t.icon}</div>
        <div><strong>${t.type}</strong><span>${t.desc}</span></div></div>`).join('')}</div>`;
  }
}
